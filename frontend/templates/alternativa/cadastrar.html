{% extends "layout.html" %}
{% block title %}Nova Alternativa{% endblock %}
{% block titulo_pagina %}Adicionar Alternativa{% endblock %}

{% block content %}
    {% if erro %}
        <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('alternativa.cadastrar') }}">
        <div class="form-grupo">
            <label>Texto da Alternativa:</label>
            <textarea name="texto" rows="3" style="width: 100%;" required></textarea>
        </div>
        
        <div class="form-grupo" style="margin-top: 15px; margin-bottom: 15px;">
            <label style="cursor: pointer;">
                <input type="checkbox" name="correta" value="True"> 
                Marcar como a alternativa CORRETA
            </label>
        </div>
        
        <div class="form-grupo">
            <label>Vincular à Questão:</label>
            <select name="questao_id" required>
                <option value="" disabled selected>Selecione a questão...</option>
                {% for q in questoes %}
                    <option value="{{ q.id }}">{{ q.id }} - {{ q.enunciado }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn" style="margin-top: 15px;">Salvar Alternativa</button>
        <a href="{{ url_for('alternativa.listar') }}" style="margin-left: 10px;">Cancelar</a>
    </form>
{% endblock %}
