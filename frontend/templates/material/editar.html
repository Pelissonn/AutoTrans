{% extends "layout.html" %}
{% block title %}Editar Material{% endblock %}
{% block titulo_pagina %}Editar Material{% endblock %}

{% block content %}
    {% if erro %}
        <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('material.editar', id=material.id) }}">
        <div class="form-grupo">
            <label>Conteúdo do Material:</label>
            <input type="text" name="conteudo" value="{{ material.conteudo }}" required>
        </div>
        
        <div class="form-grupo">
            <label>URL do Material:</label>
            <input type="url" name="url" value="{{ material.url }}" required>
        </div>
        
        <div class="form-grupo">
            <label>Categoria:</label>
            <select name="categoria_id" required>
                {% for c in categorias %}
                    <option value="{{ c.id }}" {% if c.id == material.categoria_id %}selected{% endif %}>
                        {{ c.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn">Atualizar Dados</button>
        <a href="{{ url_for('material.listar') }}" style="margin-left: 10px;">Cancelar</a>
    </form>
{% endblock %}
